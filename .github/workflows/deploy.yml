name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./winston
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: winston/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      # 组装部署目录（gh-pages 分支根目录即站点根）：
      #   /index.html          —— 在线简历首页（仓库根目录 index.html）
      #   /winston/            —— Docusaurus 博客站（baseUrl: /winston/）
      #   /personal-toolbox/   —— 个人工作台（本地优先的单文件应用）
      - name: Assemble deploy directory
        run: |
          rm -rf deploy
          mkdir -p deploy/winston deploy/personal-toolbox
          cp -r build/. deploy/winston/
          cp ../personal-toolbox/personal-workbench.html deploy/personal-toolbox/
          cp ../index.html deploy/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./winston/deploy
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
